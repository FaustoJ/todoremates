<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todoremates.com - Especialistas en Cubiertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#2B2B2B',
                        'brand-darker': '#1A1A1A',
                        'brand-accent': '#F6B64E',
                        'brand-accent-hover': '#E09F36'
                    }
                }
            }
        }
    </script>
    <style>
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25%, 75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1A1A1A; }
        ::-webkit-scrollbar-thumb { background: #F6B64E; border-radius: 4px; }
    </style>
</head>
<body class="bg-brand-darker text-gray-200 font-sans min-h-screen flex flex-col">

    <!-- Cabecera -->
    <header class="bg-brand-dark shadow-md sticky top-0 z-40 border-b border-gray-700">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white cursor-pointer" onclick="mostrarCategorias()">Todo<span class="text-brand-accent">remates</span>.com</h1>
            <nav class="flex items-center gap-6">
                <a href="#" onclick="mostrarCategorias()" class="hover:text-brand-accent transition hidden md:block">Inicio</a>
                <a href="#" onclick="document.getElementById('modal-contacto').classList.remove('hidden')" class="hover:text-brand-accent transition hidden md:block">Contacto</a>
                <button onclick="toggleCarrito()" class="relative bg-brand-accent text-brand-darker p-2 rounded-full hover:bg-brand-accent-hover transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-red-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto p-4 md:p-8">
        <!-- VISTA: Categorías -->
        <div id="vista-categorias" class="block">
            <h2 class="text-3xl font-bold text-center mb-10 text-white">Selecciona una categoría</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div onclick="cargarProductos('teja')" class="bg-brand-dark rounded-xl overflow-hidden cursor-pointer hover:ring-4 ring-brand-accent transition transform hover:-translate-y-1">
                    <img src="panel-sandwich-teja-roja-9-2048x1152.png" class="w-full h-64 object-cover">
                    <div class="p-6 text-center"><h3 class="text-2xl font-bold text-brand-accent">Panel Teja</h3></div>
                </div>
                <div onclick="cargarProductos('industrial')" class="bg-brand-dark rounded-xl overflow-hidden cursor-pointer hover:ring-4 ring-brand-accent transition transform hover:-translate-y-1">
                    <img src="panel-5-grecas-6-2048x1152.png" class="w-full h-64 object-cover">
                    <div class="p-6 text-center"><h3 class="text-2xl font-bold text-brand-accent">Panel Industrial</h3></div>
                </div>
            </div>
        </div>

        <!-- VISTA: Productos -->
        <div id="vista-productos" class="hidden">
            <div class="flex items-center gap-4 mb-8">
                <button onclick="mostrarCategorias()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded">← Volver</button>
                <h2 id="titulo-categoria" class="text-3xl font-bold text-brand-accent"></h2>
            </div>
            <div id="grid-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>
    </main>

    <!-- Modal Producto -->
    <div id="modal-producto" class="fixed inset-0 bg-black bg-opacity-80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-brand-dark rounded-xl max-w-3xl w-full flex flex-col md:flex-row overflow-hidden relative">
            <button onclick="cerrarModalProducto()" class="absolute top-4 right-4 text-gray-400 hover:text-white z-10 text-2xl">×</button>
            <div class="w-full md:w-1/2 h-64 md:h-auto"><img id="modal-img" class="w-full h-full object-cover"></div>
            <div class="w-full md:w-1/2 p-6 flex flex-col">
                <h3 id="modal-titulo" class="text-2xl font-bold text-brand-accent mb-2"></h3>
                <p id="modal-desc" class="text-gray-400 text-sm mb-4 flex-grow"></p>
                <div class="space-y-4 bg-brand-darker p-4 rounded-lg border border-gray-700">
                    <div>
                        <label class="block text-sm text-gray-300">Fabricante</label>
                        <select id="modal-fabricante" class="w-full p-2 bg-brand-dark border border-gray-600 rounded text-white">
                            <option value="">Seleccione...</option><option value="Huurre">Huurre</option><option value="Isopan">Isopan</option><option value="Kingspan">Kingspan</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-300">Espesor</label>
                        <select id="modal-espesor" class="w-full p-2 bg-brand-dark border border-gray-600 rounded text-white">
                            <option value="">Seleccione...</option><option value="30mm" data-mult="1">30 mm</option><option value="40mm" data-mult="1.1">40 mm</option>
                        </select>
                    </div>
                    <div class="flex gap-4 pt-2">
                        <input type="number" id="modal-cantidad" min="1" value="1" class="w-1/3 p-2 bg-brand-dark border border-gray-600 rounded text-white text-center">
                        <button id="btn-add-modal" class="w-2/3 bg-brand-accent text-brand-darker font-bold rounded">Añadir</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Carrito -->
    <div id="carrito-panel" class="fixed inset-y-0 right-0 w-full md:w-96 bg-brand-dark shadow-2xl transform translate-x-full transition-transform z-50 flex flex-col">
        <div class="p-6 bg-brand-darker border-b border-gray-700 flex justify-between"><h2 class="text-xl font-bold text-white">Tu Pedido</h2><button onclick="toggleCarrito()" class="text-2xl text-gray-400">×</button></div>
        <div id="cart-items" class="flex-grow overflow-y-auto p-6 space-y-4"></div>
        <div class="p-6 bg-brand-darker border-t border-gray-700">
            <div class="flex justify-between text-white text-xl font-bold mb-6"><span>Total</span><span id="cart-total" class="text-brand-accent">0.00 €</span></div>
            <button onclick="abrirCheckout()" class="w-full bg-brand-accent text-brand-darker font-bold py-3 rounded">Tramitar Pedido</button>
        </div>
    </div>

    <!-- Checkout B2B -->
    <div id="modal-checkout" class="fixed inset-0 bg-black bg-opacity-80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-brand-dark rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border border-gray-700 p-6 relative">
            <button onclick="cerrarCheckout()" class="absolute top-4 right-4 text-gray-400 text-2xl">×</button>
            <h2 class="text-2xl font-bold text-brand-accent mb-6">Finalizar Pedido</h2>
            <form onsubmit="confirmarPedido(event)" class="space-y-6">
                <div class="bg-brand-darker p-4 rounded border border-gray-700">
                    <input type="text" name="envio-nombre" placeholder="Nombre completo" required class="w-full p-2 mb-2 bg-brand-dark border border-gray-600 rounded text-white">
                    <input type="email" name="envio-email" placeholder="Email" required class="w-full p-2 mb-2 bg-brand-dark border border-gray-600 rounded text-white">
                    <input type="text" name="envio-direccion" placeholder="Dirección completa" required class="w-full p-2 bg-brand-dark border border-gray-600 rounded text-white">
                </div>
                <button type="submit" class="w-full bg-brand-accent text-brand-darker font-bold py-3 rounded text-lg">Confirmar y Pagar</button>
            </form>
        </div>
    </div>

    <!-- Contacto Directo (Para activar la cuenta la primera vez) -->
    <div id="modal-contacto" class="fixed inset-0 bg-black bg-opacity-80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-brand-dark rounded-xl max-w-md w-full p-6 relative">
            <button onclick="document.getElementById('modal-contacto').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400 text-xl">×</button>
            <h2 class="text-2xl font-bold text-brand-accent mb-4">Contacto</h2>
            <form action="https://formsubmit.co/faustomoyacastells@gmail.com" method="POST" class="space-y-4">
                <input type="hidden" name="_subject" value="Activacion de FormSubmit">
                <input type="email" name="email" placeholder="Email" required class="w-full p-2 bg-brand-darker border border-gray-600 rounded text-white">
                <button type="submit" class="w-full bg-brand-accent text-brand-darker font-bold py-2 rounded">Activar Correo</button>
            </form>
        </div>
    </div>

    <script>
        const productosDB = [
            { id: 1, cat: 'teja', nombre: "Panel Teja Roja", precio: 25.50, img: "panel-sandwich-teja-roja-9-2048x1152.png" },
            { id: 5, cat: 'industrial', nombre: "Panel 5 Grecas", precio: 21.00, img: "panel-5-grecas-6-2048x1152.png" }
        ];
        let carrito = []; let productoSeleccionado = null;

        function mostrarCategorias() { document.getElementById('vista-productos').classList.add('hidden'); document.getElementById('vista-categorias').classList.remove('hidden'); }
        
        function cargarProductos(categoria) {
            document.getElementById('vista-categorias').classList.add('hidden'); document.getElementById('vista-productos').classList.remove('hidden');
            document.getElementById('grid-productos').innerHTML = productosDB.filter(p => p.cat === categoria).map(p => `
                <div class="bg-brand-dark rounded border border-gray-700 p-4">
                    <img src="${p.img}" class="w-full h-40 object-cover cursor-pointer mb-2" onclick="abrirModal(${p.id})">
                    <h3 class="text-white font-bold">${p.nombre}</h3><p class="text-brand-accent mb-2">${p.precio}€</p>
                    <button onclick="abrirModal(${p.id})" class="w-full bg-gray-700 text-white py-1 rounded">Ver Detalles</button>
                </div>`).join('');
        }

        function abrirModal(id) {
            productoSeleccionado = productosDB.find(p => p.id === id);
            document.getElementById('modal-img').src = productoSeleccionado.img;
            document.getElementById('modal-titulo').innerText = productoSeleccionado.nombre;
            document.getElementById('modal-producto').classList.remove('hidden');
            document.getElementById('btn-add-modal').onclick = () => {
                const fab = document.getElementById('modal-fabricante').value; const espSelect = document.getElementById('modal-espesor');
                if(!fab || !espSelect.value) return alert("Selecciona fabricante y espesor");
                carrito.push({ ...productoSeleccionado, cantidad: parseInt(document.getElementById('modal-cantidad').value), fabricante: fab, espesor: espSelect.value, multiplicador: parseFloat(espSelect.options[espSelect.selectedIndex].dataset.mult) });
                actualizarCarrito(); cerrarModalProducto();
            };
        }
        function cerrarModalProducto() { document.getElementById('modal-producto').classList.add('hidden'); }
        function toggleCarrito() { document.getElementById('carrito-panel').classList.toggle('translate-x-full'); }
        function abrirCheckout() { toggleCarrito(); document.getElementById('modal-checkout').classList.remove('hidden'); }
        function cerrarCheckout() { document.getElementById('modal-checkout').classList.add('hidden'); }
        
        function actualizarCarrito() {
            document.getElementById('cart-count').innerText = carrito.length;
            let total = 0;
            document.getElementById('cart-items').innerHTML = carrito.map(item => {
                total += item.precio * item.multiplicador * item.cantidad;
                return `<div class="text-white border-b border-gray-700 pb-2">${item.cantidad}x ${item.nombre} - ${item.fabricante}</div>`;
            }).join('');
            document.getElementById('cart-total').innerText = (total * 1.21).toFixed(2) + ' €';
        }

        function confirmarPedido(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button'); btn.innerText = "Enviando..."; btn.disabled = true;
            const ref = `TR-${Math.floor(Math.random()*1000)}`;
            let data = `PEDIDO ${ref}\nNombre: ${e.target['envio-nombre'].value}\nEmail: ${e.target['envio-email'].value}\nProductos:\n` + carrito.map(i => `${i.cantidad}x ${i.nombre} (${i.fabricante})`).join('\n');

            fetch("https://formsubmit.co/ajax/faustomoyacastells@gmail.com", {
                method: "POST", headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ _subject: `Nuevo Pedido ${ref}`, Resumen: data })
            }).then(r => r.json()).then(() => {
                alert("¡Pedido enviado por email correctamente!");
                carrito = []; actualizarCarrito(); cerrarCheckout(); e.target.reset(); btn.innerText = "Confirmar y Pagar"; btn.disabled = false;
            }).catch(() => {
                alert("Error de conexión. Asegúrate de activar FormSubmit primero desde la sección Contacto."); btn.innerText = "Confirmar y Pagar"; btn.disabled = false;
            });
        }
    </script>
</body>
</html>
